{% set name = "pydocket" %}
{% set version = "0.27.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 472c1f91c1b3940c639aab37b2272f4504f8400d6d8956a13d508925d847f234

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - docket = docket.__main__:app

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python
    - burner-redis >=0.1.7
    - cachetools >=5.0.0
    - cloudpickle >=3.1.1
    - cronsim >=2.6
    - exceptiongroup >=1.2.0  # [py<311]
    - taskgroup >=0.2.2  # [py<311]
    - opentelemetry-api >=1.45.1
    - prometheus_client >=0.21.1
    - py-key-value-aio >=0.3.0
    - python-json-logger >=2.0.7
    - python-tzdata >=2025.2  # [win]
    - redis-py >=6
    - rich >=13.9.4
    - typer >=0.15.1
    - typing-extensions >=4.12.0
    - uncalled-for >=0.4.0

test:
  imports:
    - docket
  requires:
    - pip
  commands:
    - pip check
    - docket --help

about:
  home: https://github.com/chrisguidry/docket
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A distributed background task system for Python functions
  description: |
    Docket is a distributed background task system for Python functions with a
    focus on scheduling future work. It requires a Redis server with Streams
    support (Redis 5.0.0+).
  dev_url: https://github.com/chrisguidry/docket
  doc_url: https://github.com/chrisguidry/docket

extra:
  recipe-maintainers:
    - chrisguidry
    - zzstoatzz
